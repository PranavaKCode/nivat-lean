version: v0.4

project:
  name: "Nivat's conjecture"
  description: >-
    For every configuration on the integer plane over an arbitrary finite
    alphabet, a positive k by n rectangle with at most k*n occurring translated
    patterns forces a nonzero global period of the original configuration.
    The statement includes equality at the complexity threshold and rectangles
    of width or height one. The Lean proof is due to Catenation, my custom
    agentic framework, translating the argument in my paper into Lean. The
    proof uses Laurent annihilators, a sharp periodic-wedge complexity bound,
    generating polygons, and selection of the same nonperiodic orbit point
    throughout the periodic-background construction. Its mathematical setting
    is multidimensional symbolic dynamics and combinatorics of low-complexity
    configurations. The independent Challenge states the full conjecture using
    only standard Mathlib notions.
  authors:
    - Pranava Kumar
  responsible_maintainers:
    - Pranava Kumar
  license: Apache-2.0

